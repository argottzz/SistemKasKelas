# Netlify — KasSave versi frontend-saja (file statis, tanpa server).
# Cukup hubungkan repo Git: Netlify otomatis memakai file ini.
# Tidak butuh plugin Next.js, tidak butuh environment variable.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "true"
