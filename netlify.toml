# Netlify — deploy frontend KasSave (Next.js App Router)
# Cara pakai: hubungkan repo Git ke Netlify. Jika root repo = folder SistemKasKelas,
# file ini otomatis terbaca. Jika root repo lebih atas, set Base directory secara
# manual di Netlify UI ke path folder frontend (lihat README bagian Deploy).

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "true"
  # PENTING: ganti dengan URL backend Express yang sudah di-deploy (https://...)
  # atau set manual di Netlify: Site settings → Environment variables.
  # Jika dikosongkan, frontend tidak bisa login/ambil data di production.
  NEXT_PUBLIC_API_URL = "https://ganti-dengan-url-backend-kamu/api"

[[plugins]]
  package = "@netlify/plugin-nextjs"
