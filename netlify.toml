# Netlify — KasSave fullstack ala ReBites (Next.js + API routes + Supabase).
# Satu deploy: halaman + /api/* jalan sebagai Functions via Next.js Runtime.
# Wajib isi di Netlify → Site settings → Environment variables:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# (service key hanya dipakai Route Handlers di server, tidak ke browser)

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
